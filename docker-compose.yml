services:

  goof:

    image: ${APP_IMAGE:-goof:latest}

    environment:
      - DOCKER=1

    ports:
      - "3001:3001"
      - "9229:9229"

    links:
      - goof-mongo

    depends_on:
      - goof-mongo


  goof-mongo:

    image: mongo:3


  good-mysql:

    image: mysql:5

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: acme